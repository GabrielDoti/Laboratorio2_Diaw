spring.application.name=aluguel-carros

# Supabase (PostgreSQL) - valores vêm de variáveis de ambiente
# DB_URL exemplo: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed de dados de exemplo (agentes e automóveis)
app.seed.enabled=${SEED_ENABLED:true}

# CORS (URL do front React + Vite)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

server.port=8080
